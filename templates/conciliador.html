{% extends "base.html" %}
{% block title %}Conciliador Inteligente{% endblock %}

{% block content %}
<div class="d-flex align-items-center justify-content-between mb-3">
  <div>
<h2 class="mb-0">Conciliador Inteligente</h2>
    <div class="text-muted">Sube dos archivos (PDF o Excel) y ejecuta la conciliación.</div>
  </div>
</div>

<div class="card">
  <div class="card-body">
    <form method="post" enctype="multipart/form-data">
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label">Facturas (PDF o Excel)</label>
          <input class="form-control" type="file" name="facturas" accept="application/pdf,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" required>
        </div>
        <div class="col-md-6">
          <label class="form-label">Banco (PDF o Excel)</label>
          <input class="form-control" type="file" name="banco" accept="application/pdf,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" required>
        </div>
      </div>

      <div class="mt-3 d-flex gap-2">
        <button class="btn btn-primary" type="submit">Conciliar</button>
        <a class="btn btn-outline-secondary" href="{{ url_for('horas_semana') }}">Volver</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
